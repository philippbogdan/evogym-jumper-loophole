<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<circle cx="18" cy="30" r="18" fill="#ececec"/><text x="18.0" y="38.0" font-size="23" font-weight="700" fill="#0d1117" text-anchor="middle">1</text><text x="48.0" y="39.0" font-size="25" font-weight="650" fill="#ececec" text-anchor="start">The rule</text>
<rect x="0" y="290" width="290" height="210" fill="#1f1f1f"/><rect x="150" y="290" width="140" height="210" fill="#2b2b2b"/><polygon points="184,382 228,78 290,78 290,382" fill="#5e5e5e" fill-opacity="0.6"/><line x1="0" y1="290" x2="290" y2="290" stroke="#5f5f5f" stroke-width="3"/><line x1="150" y1="290" x2="290" y2="290" stroke="#ececec" stroke-width="7"/><line x1="150" y1="290" x2="150" y2="500" stroke="#5f5f5f" stroke-width="3" stroke-dasharray="9 7"/><line x1="184" y1="382" x2="228" y2="78" stroke="#d0d0d0" stroke-width="5" stroke-linecap="round"/><line x1="184" y1="382" x2="290" y2="382" stroke="#d0d0d0" stroke-width="5"/><circle cx="197.3" cy="290" r="13" fill="none" stroke="#ececec" stroke-width="3.5"/><circle cx="184" cy="382" r="10" fill="#ececec"/><text x="278.0" y="118.0" font-size="21" font-weight="400" fill="#ececec" text-anchor="end">robot</text><text x="8.0" y="246.0" font-size="20" font-weight="400" fill="#979797" text-anchor="start">the edge</text><text x="8.0" y="272.0" font-size="20" font-weight="400" fill="#979797" text-anchor="start">crosses here</text><line x1="124" y1="266" x2="181.3" y2="284" stroke="#979797" stroke-width="2"/><text x="282.0" y="486.0" font-size="20" font-weight="650" fill="#ececec" text-anchor="end">the corner's tile</text><line x1="184.0" y1="452.0" x2="184.0" y2="413.0" stroke="#e73121" stroke-width="8"/><polygon points="171.2,413.0 196.8,413.0 184.0,398.0" fill="#e73121" stroke="#e73121" stroke-width="2.5" stroke-linejoin="round"/><text x="204.0" y="440.0" font-size="24" font-weight="700" fill="#e73121" text-anchor="start">push</text>
<text x="0.0" y="545.0" font-size="21" font-weight="400" fill="#ececec" text-anchor="start">Inside a floor tile, a corner</text><text x="0.0" y="574.0" font-size="21" font-weight="400" fill="#ececec" text-anchor="start">is pushed out only if its own</text><text x="0.0" y="603.0" font-size="21" font-weight="400" fill="#ececec" text-anchor="start">edge crosses that tile's top.</text>
<circle cx="348" cy="30" r="18" fill="#ececec"/><text x="348.0" y="38.0" font-size="23" font-weight="700" fill="#0d1117" text-anchor="middle">2</text><text x="378.0" y="39.0" font-size="25" font-weight="650" fill="#ececec" text-anchor="start">The miss</text>
<rect x="330" y="290" width="290" height="210" fill="#1f1f1f"/><rect x="330" y="290" width="150" height="210" fill="#2b2b2b"/><polygon points="467,382 511,78 620,78 620,382" fill="#5e5e5e" fill-opacity="0.6"/><line x1="330" y1="290" x2="620" y2="290" stroke="#5f5f5f" stroke-width="3"/><line x1="330" y1="290" x2="480" y2="290" stroke="#ececec" stroke-width="7"/><line x1="480" y1="290" x2="480" y2="500" stroke="#5f5f5f" stroke-width="3" stroke-dasharray="9 7"/><line x1="467" y1="382" x2="511" y2="78" stroke="#d0d0d0" stroke-width="5" stroke-linecap="round"/><line x1="467" y1="382" x2="620" y2="382" stroke="#d0d0d0" stroke-width="5"/><circle cx="480.3" cy="290" r="13" fill="none" stroke="#ececec" stroke-width="3.5"/><circle cx="467" cy="382" r="10" fill="#ececec"/><text x="608.0" y="118.0" font-size="21" font-weight="400" fill="#ececec" text-anchor="end">robot</text><text x="338.0" y="246.0" font-size="20" font-weight="400" fill="#979797" text-anchor="start">the edge</text><text x="338.0" y="272.0" font-size="20" font-weight="400" fill="#979797" text-anchor="start">crosses here</text><line x1="454" y1="266" x2="464.3" y2="284" stroke="#979797" stroke-width="2"/><text x="338.0" y="486.0" font-size="20" font-weight="650" fill="#ececec" text-anchor="start">the corner's tile</text><text x="445.0" y="390.0" font-size="24" font-weight="700" fill="#ececec" text-anchor="end">no push</text>
<text x="330.0" y="545.0" font-size="21" font-weight="400" fill="#ececec" text-anchor="start">A corner sits 0.06 mm inside</text><text x="330.0" y="574.0" font-size="21" font-weight="400" fill="#ececec" text-anchor="start">one tile. Its edge crosses the</text><text x="330.0" y="603.0" font-size="21" font-weight="400" fill="#ececec" text-anchor="start">top of the next. Neither pushes.</text>
<circle cx="678" cy="30" r="18" fill="#ececec"/><text x="678.0" y="38.0" font-size="23" font-weight="700" fill="#0d1117" text-anchor="middle">3</text><text x="708.0" y="39.0" font-size="25" font-weight="650" fill="#ececec" text-anchor="start">Through the floor</text>
<rect x="670.0" y="262" width="90" height="90" fill="#1f1f1f" stroke="#5f5f5f" stroke-width="3"/><rect x="760.0" y="262" width="90" height="90" fill="#1f1f1f" stroke="#5f5f5f" stroke-width="3"/><rect x="850.0" y="262" width="90" height="90" fill="#1f1f1f" stroke="#5f5f5f" stroke-width="3"/><rect x="760.0" y="263.2" width="90" height="87.2" fill="#5e5e5e" fill-opacity="0.92" stroke="#d0d0d0" stroke-width="4"/><rect x="760.0" y="182.2" width="90" height="81.0" fill="#bdbdbd" stroke="#ececec" stroke-width="4"/><rect x="752.0" y="254" width="16" height="16" fill="#0d1117" stroke="#ececec" stroke-width="3"/><rect x="842.0" y="254" width="16" height="16" fill="#0d1117" stroke="#ececec" stroke-width="3"/><circle cx="760.0" cy="350.4" r="8" fill="#ececec"/><circle cx="850.0" cy="350.4" r="8" fill="#ececec"/><text x="805.0" y="124.2" font-size="26" font-weight="700" fill="#ececec" text-anchor="middle">21 m/s</text><line x1="805.0" y1="136.2" x2="805.0" y2="162.2" stroke="#ececec" stroke-width="5"/><polygon points="794.8,162.2 815.2,162.2 805.0,174.2" fill="#ececec"/><text x="805.0" y="392.0" font-size="25" font-weight="700" fill="#ececec" text-anchor="middle">no force</text><text x="805.0" y="424.0" font-size="20" font-weight="400" fill="#979797" text-anchor="middle">robot inside the floor</text>
<text x="660.0" y="545.0" font-size="21" font-weight="400" fill="#ececec" text-anchor="start">The cell falls straight in</text><text x="660.0" y="574.0" font-size="21" font-weight="400" fill="#ececec" text-anchor="start">and stops at the underside</text><text x="660.0" y="603.0" font-size="21" font-weight="400" fill="#ececec" text-anchor="start">of the floor, 9.7 cm deep.</text>
<circle cx="1008" cy="30" r="18" fill="#ececec"/><text x="1008.0" y="38.0" font-size="23" font-weight="700" fill="#0d1117" text-anchor="middle">4</text><text x="1038.0" y="39.0" font-size="25" font-weight="650" fill="#ececec" text-anchor="start">The release</text>
<rect x="1000.0" y="262" width="90" height="90" fill="#1f1f1f" stroke="#5f5f5f" stroke-width="3"/><rect x="1090.0" y="262" width="90" height="90" fill="#1f1f1f" stroke="#5f5f5f" stroke-width="3"/><rect x="1180.0" y="262" width="90" height="90" fill="#1f1f1f" stroke="#5f5f5f" stroke-width="3"/><rect x="1090.0" y="263.2" width="90" height="87.2" fill="#5e5e5e" fill-opacity="0.92" stroke="#d0d0d0" stroke-width="4"/><rect x="1090.0" y="182.2" width="90" height="81.0" fill="#bdbdbd" stroke="#ececec" stroke-width="4"/><rect x="1082.0" y="254" width="16" height="16" fill="#0d1117" stroke="#ececec" stroke-width="3"/><rect x="1172.0" y="254" width="16" height="16" fill="#0d1117" stroke="#ececec" stroke-width="3"/><circle cx="1090.0" cy="350.4" r="8" fill="#ececec"/><circle cx="1180.0" cy="350.4" r="8" fill="#ececec"/><line x1="1090.0" y1="412.0" x2="1090.0" y2="381.0" stroke="#e73121" stroke-width="9"/><polygon points="1075.5,381.0 1104.5,381.0 1090.0,364.0" fill="#e73121" stroke="#e73121" stroke-width="2.5" stroke-linejoin="round"/><line x1="1090.0" y1="458.0" x2="1090.0" y2="435.0" stroke="#e73121" stroke-width="9"/><polygon points="1075.5,435.0 1104.5,435.0 1090.0,418.0" fill="#0d1117" stroke="#e73121" stroke-width="2.5" stroke-linejoin="round"/><line x1="1180.0" y1="412.0" x2="1180.0" y2="381.0" stroke="#e73121" stroke-width="9"/><polygon points="1165.5,381.0 1194.5,381.0 1180.0,364.0" fill="#e73121" stroke="#e73121" stroke-width="2.5" stroke-linejoin="round"/><line x1="1180.0" y1="458.0" x2="1180.0" y2="435.0" stroke="#e73121" stroke-width="9"/><polygon points="1165.5,435.0 1194.5,435.0 1180.0,418.0" fill="#0d1117" stroke="#e73121" stroke-width="2.5" stroke-linejoin="round"/><text x="1135.0" y="492.0" font-size="25" font-weight="700" fill="#e73121" text-anchor="middle">4 × 214 kN</text><line x1="1135.0" y1="170.2" x2="1135.0" y2="124.2" stroke="#e73121" stroke-width="6"/><polygon points="1123.1,124.2 1146.9,124.2 1135.0,110.2" fill="#e73121" stroke="#e73121" stroke-width="2.5" stroke-linejoin="round"/><text x="1135.0" y="98.2" font-size="26" font-weight="700" fill="#ececec" text-anchor="middle">110 m/s</text>
<text x="990.0" y="545.0" font-size="21" font-weight="400" fill="#ececec" text-anchor="start">The sides straighten, the rule</text><text x="990.0" y="574.0" font-size="21" font-weight="400" fill="#ececec" text-anchor="start">fires, and the force grows</text><text x="990.0" y="603.0" font-size="21" font-weight="400" fill="#ececec" text-anchor="start">with depth: 110 m/s in 1.2 ms.</text>
</svg>
